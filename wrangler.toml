# SmartCost Zero-Cost Cloud Infrastructure Configuration (RM0.00 / month)
# - Frontend SPA Hosting: Cloudflare Pages Free (dist/)
# - Edge API Gateway & Routing: Cloudflare Workers Free (100,000 req/day, 10ms CPU/req)
# - Zero Paid Features Enabled (No Durable Objects, No Paid Queues, No Paid Load Balancer)

name = "smartcost-zero-cost-gateway"
main = "workers/smartcost-edge-worker.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# Cloudflare Workers + Static Assets & Cloudflare Pages Build Settings:
# - Build command: npm run build (or bun run build)
# - Build output directory: dist
# - Static assets from dist/ (index.html, assets/) are served directly at / and SPA routes
# - /api/* and /healthz always run through workers/smartcost-edge-worker.ts first
# - Optional Build env var if calling an external Express backend directly from browser:
#   VITE_API_URL = "https://your-express-backend.example.com"
# - Or set Worker Secret ORIGIN_API_URL so the Worker proxies /api/* without CORS

[vars]
APP_COST_TIER = "RM0.00-Free-Tier"
FIRESTORE_PROJECT_ID = "reflecting-booth-740ks"
FIRESTORE_DATABASE_ID = "ai-studio-remixsmartcostpr-940297e1-af61-42e5-8469-9bca8d60c481"
# Optional comma-separated custom frontend origins allowed by CORS:
# ALLOWED_ORIGINS = "https://smartcost.yourdomain.com"

# Encrypted Secrets & Variables (NEVER commit real values — set via Cloudflare Dashboard -> Settings -> Variables and Secrets):
# - GEMINI_API_KEY      : (Secret) Server-side Gemini API key for Mr Cost AI (/api/mrcost/chat)
# - SESSION_SECRET      : (Secret) Random 64-char hex string for HMAC-SHA256 session tokens (auto-falls back if omitted during initial test)
# - DEV_ACCESS_SECRET   : (Secret, Optional) Developer Alt+D passkey secret (Google Developer Sign-In works even when omitted)
# - ORIGIN_API_URL      : (Variable/Secret, Optional) External Express backend URL; leave empty for Cloudflare Standalone Edge Mode
# - ALLOWED_ORIGINS     : (Variable, Optional) Comma-separated extra CORS origins (*.workers.dev & *.pages.dev are allowed automatically)
# - VITE_API_URL        : (Build Env Var, Optional) Leave empty for same-origin Worker; set only if calling external Express directly from browser
# - VITE_API_BASE_URL   : (Build Env Var, Optional) Alias for VITE_API_URL
